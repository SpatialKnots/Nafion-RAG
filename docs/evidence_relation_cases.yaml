  sanginov_isotherms:
    source: sanginov
    page: 9
    text_layer: original
    start: 2939
    text: "Fig. 10 shows the conductivity isotherms for Li-Naﬁon mem- \nbranes saturated with the binary plasticiser EC/SL\
      \ with varying ra- \ntios between components. As can be seen from the Fig., the mem- \nbrane conductivity reaches the\
      \ highest values at ω(SL) = 0.20 re- \ngardless of temperature. Although this value was rather high at \nroom temperature\
      \ (~ 2 × 10 −4 S cm −1 ), below 10 °C, a drop in \nconductivity was observed ( Fig. 8 )."
    text_sha256: 79caca4f0960d37a771b84784ccff766b77950138d2d208f517f665d42412f08
    section: 'Figure 10 discussion: composition and conductivity'
  sanginov_synergy:
    source: sanginov
    page: 10
    text_layer: original
    start: 338
    text: "to the membrane with ω (SL) = 0.20, the conductivity of the sam- \nple with ω (SL) = 0.40 is very close to that\
      \ of the membrane sat- \nurated with pure EC ( Fig. 10 ) yet retains acceptable conductivity \ndown to -40 °C ( Fig.\
      \ 8 ). Therefore, in terms of both conductivity \nvalues and operating temperature range, this membrane seems to \n\
      be the best among the studied samples. \nThus, the transport properties clearly indicate a synergistic ef- \nfect when\
      \ using the EC / SL binary solvent for Li-Naﬁon swelling in \ncomparison with individual components. This conclusion\
      \ ﬁts well \nwith predictions of quantum-chemical calculations ( Section 4.2 ). \nWithin the framework of the commonly\
      \ used cluster-network \nmodel of cation transfer in Naﬁon membranes [20] , it can be as- \nsumed that the main reason\
      \ for the decrease in conductivity and \nsimultaneous increase in the activation energy with an increase in \nthe SL\
      \ content is associated with a signiﬁcant increase in viscosity: \nSL viscosity is an order of magnitude higher than\
      \ that of EC (see \nTable 1 ). As is known, the solvent viscosity strongly inﬂuences the \nionic conductivity of liquid\
      \ electrolytes [ 1 , 2 , 49 ]. The change in the \ncomposition of the predominant ionic species with an increase in\
      \ \nthe SL content is also essential (see Sections 4.2 and 4.3 ), since it is \nthese particles that are involved in\
      \ ion transport in the plasticised \nLi-Naﬁon membrane."
    text_sha256: 04f145f5d847ac250fae09eb3ac8151ea7c4c2af77873639537c01cd5381ec22
    section: Composition, operating range and transport interpretation
  sanginov_scope:
    source: sanginov
    page: 9
    text_layer: original
    start: 272
    text: "SL content in the plasticiser shifts the lower limit of membranes \nconductivity down to ≤-40 °C, which is signiﬁcantly\
      \ lower than \nthe solidus temperature of the EC-SL binary system. The absence \nof any correlation with phase transitions\
      \ in the EC – SL system \n(see Section 4.1 ) seems to be predictable so far as, strictly speak- \ning, the plasticised\
      \ Li-Naﬁon membranes are homogeneous sys- \ntems in thermodynamic sense; thus, the plasticiser, being a part \nof the\
      \ membrane, should not show the same phase transitions as \nEC/SL mixtures. However, the temperature can inﬂuence the\
      \ equi- \nlibrium swelling degree of the membrane, leading to the release of \nexcessive amounts of plasticiser onto\
      \ the ﬁlm surface upon cool- \ning. This seems to cause problems in measuring the conductivity at \nlow temperatures,\
      \ since the free plasticiser solidiﬁes and forms a \nnon-conductive layer at the electrode / electrolyte interface under\
      \ \nthese conditions. The questions about the state of the plasticiser \nin the membrane and the inﬂuence of temperature\
      \ on the equilib- \nrium degree of Li-Naﬁon swelling seems to be critical, deserving a \nspecial study that is beyond\
      \ the scope of this work. (The same is \ntrue for the question of the presence or absence of selective sorp- \ntion\
      \ of one of the components of the binary plasticiser)."
    text_sha256: 962f72e5454cefb6edfbb5f782801dc29018245320fb73a15c1e9ba5dc51c8ea
    section: Scope limitation on temperature and equilibrium swelling
  istomina_conductivity:
    source: istomina
    page: 6
    text_layer: original
    start: 406
    text: |-
      Figure 3b shows the conductivity isotherm at room temperature for Li-Naﬁon mem-
      branes saturated with EC/SL mixtures of varying compositions at a mixing temperature of
      40 ◦C. For samples saturated with the EC/SL mixtures enriched with ethylene carbonate
      (ω(SL) < 0.2), it was not possible to measure the conductivity: on cooling from 40 to 25 ◦C,
      an excess amount of EC released from the membrane (syneresis) was solidiﬁed on the
      membrane surface. This phase separation agrees with the phase diagram of the EC–SL
      system [31]: liquidus temperatures for EC/SL mixtures with ω(SL) < 0.2 are above 25 ◦C.
      Thus, the non-conductive layer of solid plasticiser forming between the membrane and
      electrodes makes impedance measurements impossible. The best transport properties of
      Li-Naﬁon provided EC/SL mixtures enriched with ethylene carbonate. The membrane
      conductivity rapidly decreases with ω(SL) in the range of 0.2 to 0.7 (eutectic composition),
      but then it remains practically unchanged up to pure sulfolane (Figure 3b). Although the
      decrease in conductivity may be caused by an increase in viscosity with SL content in
      the mixture [32], this can also be explained in terms of changes in ionic equilibria with
      the EC/SL mixture composition (since EC and SL differ in solvating ability [26]) or a
      decrease in the solvent uptake (Figure 3a) inﬂuencing the conduction channels within the
      membrane [1].
    text_sha256: 386aed7076df403404b76e0b553de36e8b1d9520331687e5283ca2a3d0a88052
    section: 'Section 3.2: composition effect at fixed mixing temperature'
  istomina_heating:
    source: istomina
    page: 6
    text_layer: original
    start: 1858
    text: |-
      In order to study the inﬂuence of the mixing temperature on the solvent uptake
      of Li-Naﬁon, pure EC and SL were selected along with binary EC/SL mixtures of two
      compositions: ω(SL) = 0.2 and 0.7. The choice of these binary compositions was due to
      the EC-enriched mixture with ω(SL) = 0.2 providing the highest conductivity values of
      Li-Naﬁon (Figure 3b) and being homogeneous at room temperature, which prevents phase
      separation upon cooling, while the mixture with ω(SL) = 0.7 corresponds to the eutectic
      point of the EC–SL system [31].
      Measurements of the W–T dependencies were carried out by sequential heating (40 to
      80 ◦C with 10 ◦C steps) and cooling (80 to 40 ◦C with 20 ◦C steps). Figure 4 displays the
      results obtained. It can be seen that the mixing temperature has a powerful effect on the
      solvent uptake of Li-Naﬁon regardless of the plasticiser composition: the higher the mixing
      temperature, the greater the solvent uptake. However, this characteristic was observed
      only in the heating cycle (Figure 4); during the cooling cycle, the decrease in solvent uptake
      was barely noticeable. As a result, the W value obtained for the highest temperature
      was virtually maintained for all other annealing temperatures at the cooling mode for all
      plasticiser compositions studied (Figure 4). Upon cooling from 80 ◦C, the W value for this
      temperature was almost preserved after thermal treatment at 60 and 40 ◦C. If cooling was
      carried out from 60 ◦C, again, a similar W value was retained after thermal treatment at
      40 ◦C (Figure 4a). At the end of measurements, long-term (60 days) isothermal treatment
      was carried out at 40 ◦C to check that the equilibrium state of the swollen samples during
      the cooling cycle was achieved. However, this procedure did not inﬂuence the obtained W
      values. This observation suggests either that the samples are close to the equilibrium state
      or that syneresis requires a very long time.
      The observed hysteresis in solvent uptake between the heating and cooling curves
      supports the hypothesis that an irreversible rearrangement of the supermolecular structure
      occurs under the inﬂuence of a plasticiser and elevated temperatures. Here, it should be
      noted that all membrane samples retained their integrity upon swelling despite signiﬁcant
      mechanical properties changes.
    text_sha256: bb1e118f808b3ca031e977512347b374134c17b3bc6aa321c3e2d40d54367e04
    section: 'Section 3.3: heating/cooling and solvent uptake'
  istomina_figure4:
    source: istomina
    page: 7
    text_layer: original
    start: 32
    text: |-
      Figure 4. Dependence of the weight uptake (W) and molar uptake (λ) of a solvent of the Li-Naﬁon
      membrane vs. mixing temperature at heating and cooling mode for the following solvents: ethylene
      carbonate (EC) (a); sulfolane (SL) (b); EC/SL with ω(SL) = 0.2 (c); EC/SL with ω(SL) = 0.7 (d).
    text_sha256: 94cbac6a04061dee0ca0deb05b45141888dfbff2ea2e7bcc02c25f3ef2017469
    section: Figure 4 caption; graph was visually reviewed
