    start: 1660
    text: "Полиперфторсульфоновые кислоты семейства Nafion после замещения H+ на Li+ \nсоздают такую среду – сульфонат-анион\
      \ –SO3− ковалентно закреплен в полимере и \nобеспечивает униполярный перенос катионов Li+. Однако в «сухом» состоянии\
      \ проводимость \nневелика (10−7 См/см), и ее повышают пластификацией высокополярными растворителями, \nсмесью циклических\
      \ и линейных карбонатов с высокой температурой кипения. Так, для \nLi‑Nafion достигают σLi+ 10−4 См/см при 25 °C в смесях\
      \ этиленкарбонат/сульфолан [93, 94], а \nв смеси пропиленкарбонат/диметилформамид сообщалось о σLi+ ≈ 3.4·10−3 См/см\
      \ [92]. \n \nВыбор пластификатора для мембраны обусловлен рядом ограничений. Наилучшие \nпоказатели проводимости порядка\
      \ 10–3 См/см демонстрируют мембраны, набухшие в \nдиметилсульфоксиде (ДМСО), N,N-диметилформамиде (ДМФА) и N-метил-2-пирролидоне\
      \ \n(НМП) [95]. Такие высокополярные пластификаторы, однако, не могут быть использованы \nввиду процесса растворения\
      \ мембраны при повышенных температурах, а также разложения \nсамих пластификаторов в ходе эксплуатации литий-ионного\
      \ элемента. Авторы [93] показали, \nчто мембрана Li-Nafion 115, пластифицированная в смеси этиленкарбонат/сульфолан,\
      \ имеет"
    text_sha256: 76a78e1a65c1d40f06359914310a30f5fca147031cf623252c0ab08f5b2cc1b9
    section: Background on conductivity and plasticizers
